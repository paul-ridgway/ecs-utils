name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Cross-compile
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
